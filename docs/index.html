<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ooga Booga Launcher Updates</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0b0b; --fg:#ece7da; --muted:#9b978d; --line:#343432; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:monospace; }
    main { width:min(620px, calc(100% - 40px)); padding:48px 0; }
    h1 { font-family:serif; font-size:clamp(2rem,8vw,4rem); line-height:.95; margin:0 0 34px; }
    .joke { color:var(--muted); line-height:1.7; margin-bottom:34px; }
    .status { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:24px 0; line-height:1.7; }
    a { display:inline-block; margin-top:28px; color:var(--fg); text-underline-offset:5px; }
    small { display:block; color:var(--muted); margin-top:18px; }
  </style>
</head>
<body>
  <main>
    <h1>Check for Updates</h1>
    <div class="joke">The launcher can't check.<br>It doesn't have internet.<br><br>Your browser, however, does.</div>
    <div id="status" class="status" role="status">Asking GitHub what the latest cave drawing says…</div>
    <a id="download" href="https://github.com/Sidd-Rai/Ooga-Booga-Launcher/releases/latest">Open latest release</a>
    <small id="versions"></small>
  </main>
  <script>
    const current = new URLSearchParams(location.search).get('version') || 'unknown';
    const status = document.querySelector('#status');
    const versions = document.querySelector('#versions');
    const download = document.querySelector('#download');
    const normalize = value => value.replace(/^v/i, '').split('.').map(part => Number.parseInt(part, 10) || 0);
    const compare = (left, right) => {
      const a = normalize(left), b = normalize(right);
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) - (b[i] || 0);
      }
      return 0;
    };
    fetch('https://api.github.com/repos/Sidd-Rai/Ooga-Booga-Launcher/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
      .then(response => { if (!response.ok) throw new Error('GitHub did not answer'); return response.json(); })
      .then(release => {
        const latest = release.tag_name.replace(/^v/i, '');
        versions.textContent = `Installed: ${current}  •  Latest: ${latest}`;
        status.textContent = current !== 'unknown' && compare(current, latest) >= 0
          ? 'You are up to date. The cave is stable.'
          : `Your version is ${current}. The latest version is ${latest}.`;
        const apk = release.assets.find(asset => asset.name.toLowerCase().endsWith('.apk'));
        download.href = apk ? apk.browser_download_url : release.html_url;
        download.textContent = apk ? `Download ${latest}` : 'Open latest release';
      })
      .catch(() => {
        status.textContent = 'GitHub is being mysterious. Open the releases page to check manually.';
        versions.textContent = `Installed: ${current}`;
      });
  </script>
</body>
</html>
