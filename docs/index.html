<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ooga Booga Launcher — Releases</title>
  <style>
    :root { color-scheme:dark; --bg:#0a0b0b; --fg:#ece7da; --muted:#9b978d; --line:#343432; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:monospace; }
    main { width:min(720px, calc(100% - 40px)); margin:auto; padding:64px 0; }
    h1 { font-family:serif; font-size:clamp(2.2rem,8vw,4.4rem); line-height:.95; margin:0 0 38px; }
    h2 { margin:42px 0 18px; font-size:1rem; letter-spacing:.12em; }
    h3 { margin:0 0 12px; font-size:1rem; }
    .status, article { border-top:1px solid var(--line); padding:22px 0; line-height:1.7; }
    article:last-child { border-bottom:1px solid var(--line); }
    pre { color:var(--muted); font:inherit; line-height:1.65; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
    a { display:inline-block; margin-top:24px; color:var(--fg); text-underline-offset:5px; }
    small { display:block; color:var(--muted); margin-top:12px; }
  </style>
</head>
<body>
  <main>
    <h1>Ooga Booga Launcher</h1>
    <div id="status" class="status" role="status">Loading official release information…</div>
    <a id="download" href="https://github.com/Sidd-Rai/Ooga-Booga-Launcher/releases/latest">Open latest release</a>
    <small id="versions"></small>
    <h2>CHANGELOG</h2>
    <section id="changelog" aria-live="polite"></section>
  </main>
  <script>
    const current = new URLSearchParams(location.search).get('version') || 'unknown';
    const status = document.querySelector('#status');
    const versions = document.querySelector('#versions');
    const download = document.querySelector('#download');
    const changelog = document.querySelector('#changelog');
    const normalize = value => value.replace(/^v/i, '').split('.').map(part => Number.parseInt(part, 10) || 0);
    const compare = (left, right) => {
      const a = normalize(left), b = normalize(right);
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) - (b[i] || 0);
      }
      return 0;
    };
    fetch('https://api.github.com/repos/Sidd-Rai/Ooga-Booga-Launcher/releases?per_page=10', {
      headers: { Accept: 'application/vnd.github+json' }
    })
      .then(response => { if (!response.ok) throw new Error('GitHub did not answer'); return response.json(); })
      .then(releases => {
        const published = releases.filter(release => !release.draft && !release.prerelease);
        if (!published.length) throw new Error('No published releases');
        const latestRelease = published[0];
        const latest = latestRelease.tag_name.replace(/^v/i, '');
        versions.textContent = `Installed: ${current}  •  Latest: ${latest}`;
        status.textContent = current !== 'unknown' && compare(current, latest) >= 0
          ? `Version ${current} is up to date.`
          : `Version ${latest} is available. You currently have ${current}.`;
        const apk = latestRelease.assets.find(asset => asset.name.toLowerCase().endsWith('.apk'));
        download.href = apk ? apk.browser_download_url : latestRelease.html_url;
        download.textContent = apk ? `Download version ${latest}` : 'Open latest release';
        published.forEach(release => {
          const article = document.createElement('article');
          const heading = document.createElement('h3');
          const notes = document.createElement('pre');
          heading.textContent = release.name || release.tag_name;
          notes.textContent = release.body || 'No release notes provided.';
          article.append(heading, notes); changelog.append(article);
        });
      })
      .catch(() => {
        status.textContent = 'Release information could not be loaded. Open GitHub Releases to check manually.';
        versions.textContent = `Installed: ${current}`;
        const article = document.createElement('article');
        article.textContent = 'Changelog unavailable.'; changelog.append(article);
      });
  </script>
</body>
</html>
